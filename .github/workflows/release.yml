name: Build & Release

# Triggers:
#   1. Any push to the `release` branch       → build all platforms + publish a
#      pre-release so the binaries are always available from the latest release code.
#   2. A version tag (v*.*.*) pushed to any branch → build + publish a full release.
#   3. Manual trigger from the Actions tab    → build only (no release created).
on:
   push:
      branches:
         - release
      tags:
         - "v*.*.*"
   workflow_dispatch:

jobs:
   # ── Build job — runs in parallel on all three platforms ─────────────────────
   build:
      name: Build (${{ matrix.os }})
      runs-on: ${{ matrix.os }}
      strategy:
         fail-fast: false # let all three platforms finish even if one fails
         matrix:
            include:
               - os: windows-latest
                 dist_name: timecode.exe
                 artifact: Timecode-Windows.exe
               - os: ubuntu-latest
                 dist_name: timecode
                 artifact: Timecode-Linux
               - os: macos-latest
                 dist_name: timecode
                 artifact: Timecode-macOS

      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Set up Python 3.12
           uses: actions/setup-python@v5
           with:
              python-version: "3.12"
              cache: pip

         # PortAudio is bundled inside the sounddevice wheel on Windows and macOS.
         # On Linux it must be installed from the system package manager so that
         # PyInstaller can find and bundle the shared library.
         - name: Install PortAudio (Linux only)
           if: runner.os == 'Linux'
           run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev

         - name: Install Python dependencies
           run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt pyinstaller

         - name: Build single-file executable
           run: pyinstaller timecode.spec

         # Rename the output to include the platform name so all three files can
         # coexist in the same GitHub Release without overwriting each other.
         - name: Rename binary
           shell: bash
           run: mv dist/${{ matrix.dist_name }} dist/${{ matrix.artifact }}

         - name: Upload build artifact
           uses: actions/upload-artifact@v4
           with:
              name: ${{ matrix.artifact }}
              path: dist/${{ matrix.artifact }}

   # ── Release job — runs after all builds succeed ──────────────────────────────
   release:
      name: Publish Release
      needs: build
      runs-on: ubuntu-latest
      # Don't publish anything on a manual workflow_dispatch run.
      if: github.event_name != 'workflow_dispatch'
      permissions:
         contents: write # required to create releases and upload assets

      steps:
         - name: Download all platform artifacts
           uses: actions/download-artifact@v4
           with:
              path: artifacts
              merge-multiple: true # flatten into a single directory

         # Push to `release` branch (not a tag) → rolling "latest" pre-release.
         # The existing `latest-release` release is deleted and recreated so the
         # binaries always reflect the current state of the release branch.
         - name: Publish rolling pre-release (release branch)
           if: github.ref == 'refs/heads/release'
           uses: softprops/action-gh-release@v2
           with:
              tag_name: latest-release
              name: Latest Release Build
              prerelease: true
              generate_release_notes: false
              body: |
                 Automated build from the `release` branch — commit ${{ github.sha }}.
                 This is updated on every push to `release` and is not a versioned release.
              files: artifacts/*

         # Push of a version tag → proper versioned release.
         - name: Publish versioned release (tag)
           if: startsWith(github.ref, 'refs/tags/')
           uses: softprops/action-gh-release@v2
           with:
              generate_release_notes: true # auto-generate notes from commits/PRs
              files: artifacts/*
