name: Build & Release

# Triggers:
#   1. Any push/merge to the `release` branch  -> auto-compute CalVer tag, build
#      all three platforms, and publish a GitHub Release.
#   2. Manual trigger from the Actions tab      -> build only (no release/tag created).
#
# Version format: YYYY.MM.N
#   YYYY = four-digit year, MM = zero-padded month, N = 1-based counter that
#   resets to 1 each calendar month (e.g. 2026.04.1, 2026.04.2, 2026.05.1 ...).
on:
   push:
      branches:
         - release
   workflow_dispatch:

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   # ---------------------------------------------------------------------------
   # Version job - computes CalVer before building so binaries embed it
   # ---------------------------------------------------------------------------
   version:
      name: Compute version
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
      outputs:
         version: ${{ steps.calver.outputs.version }}
      steps:
         - name: Checkout code (full history + tags)
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Compute CalVer version
           id: calver
           shell: bash
           run: |
              git fetch --tags
              YEAR_MONTH=$(date -u +'%Y.%m')
              EXISTING=$(git tag -l "${YEAR_MONTH}.*" \
                | sed "s/^${YEAR_MONTH}\.//" \
                | grep -E '^[0-9]+$' || true)
              LAST_N=$(echo "$EXISTING" | sort -n | tail -1)
              N=$(( ${LAST_N:-0} + 1 ))
              VERSION="${YEAR_MONTH}.${N}"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "Computed version: ${VERSION}"

   # ---------------------------------------------------------------------------
   # Build job - runs in parallel on all three platforms, each publishing a
   # single self-contained executable (the .NET equivalent of the PyInstaller
   # --onefile build).
   # ---------------------------------------------------------------------------
   build:
      name: Build (${{ matrix.os }})
      runs-on: ${{ matrix.os }}
      needs: version
      # Hard guard: skip entirely if this runs on the wrong branch (e.g. dev).
      if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: windows-latest
                 rid: win-x64
                 dist_name: Techibbie.TimecodeGenerator.exe
                 artifact: Techibbie.TimecodeGenerator-Windows.exe
               - os: ubuntu-latest
                 rid: linux-x64
                 dist_name: Techibbie.TimecodeGenerator
                 artifact: Techibbie.TimecodeGenerator-Linux
               - os: macos-latest
                 rid: osx-x64
                 dist_name: Techibbie.TimecodeGenerator
                 artifact: Techibbie.TimecodeGenerator-macOS

      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Set up .NET 8 SDK
           uses: actions/setup-dotnet@v4
           with:
              dotnet-version: "8.0.x"

         - name: Inject version into source
           env:
              APP_VER: ${{ needs.version.outputs.version }}
           shell: bash
           run: |
              sed -i.bak "s/AppVersion = \"dev\"/AppVersion = \"${APP_VER}\"/" src/Techibbie.TimecodeGenerator.App/AppInfo.cs
              rm -f src/Techibbie.TimecodeGenerator.App/AppInfo.cs.bak
              echo "AppVersion set to ${APP_VER}"

         - name: Restore
           run: dotnet restore

         - name: Run tests
           run: dotnet test tests/Techibbie.TimecodeGenerator.Core.Tests --configuration Release

         - name: Publish self-contained single-file executable
           run: >
              dotnet publish src/Techibbie.TimecodeGenerator.App
              --configuration Release
              --runtime ${{ matrix.rid }}
              --self-contained true
              -p:PublishSingleFile=true
              -p:IncludeNativeLibrariesForSelfExtract=true
              -o publish/${{ matrix.rid }}

         # Rename the output to include the platform name so all three files can
         # coexist in the same GitHub Release without overwriting each other.
         - name: Rename binary
           shell: bash
           run: mv "publish/${{ matrix.rid }}/${{ matrix.dist_name }}" "publish/${{ matrix.rid }}/${{ matrix.artifact }}"

         - name: Upload build artifact
           uses: actions/upload-artifact@v4
           with:
              name: ${{ matrix.artifact }}
              path: publish/${{ matrix.rid }}/${{ matrix.artifact }}

   # ---------------------------------------------------------------------------
   # Release job - runs after all builds succeed
   # ---------------------------------------------------------------------------
   release:
      name: Publish Release
      needs: [version, build]
      runs-on: ubuntu-latest
      # Only publish on branch pushes; skip manual workflow_dispatch runs.
      if: github.event_name == 'push'
      permissions:
         contents: write

      steps:
         - name: Checkout code (full history + tags)
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         # Reject the release if CHANGELOG_LATEST.md still has the placeholder text.
         # This must run before the tag is created so no dangling tag is left behind.
         - name: Validate CHANGELOG_LATEST.md
           shell: bash
           run: |
              if grep -q "Replace this comment with your release notes" CHANGELOG_LATEST.md; then
                echo "ERROR: CHANGELOG_LATEST.md still contains the placeholder text."
                echo "Update it with real release notes before merging to release."
                exit 1
              fi
              if ! grep -qE '[a-zA-Z0-9]' CHANGELOG_LATEST.md; then
                echo "ERROR: CHANGELOG_LATEST.md appears to be empty."
                exit 1
              fi
              echo "CHANGELOG_LATEST.md looks good."

         # Tag the commit and push so the GitHub Release is tied to this exact SHA.
         - name: Create and push version tag
           run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "${{ needs.version.outputs.version }}"
              git push origin "${{ needs.version.outputs.version }}"

         # Prepend the versioned entry to CHANGELOG.md automatically.
         - name: Update CHANGELOG.md
           shell: bash
           run: |
              VERSION="${{ needs.version.outputs.version }}"
              DATE=$(date -u +'%Y-%m-%d')
              MARKER="<!-- Releases are prepended here automatically by CI after each merge to release. -->"
              MARKER_LINE=$(grep -n "$MARKER" CHANGELOG.md | head -1 | cut -d: -f1)
              if [ -n "$MARKER_LINE" ]; then
                head -n "$MARKER_LINE" CHANGELOG.md > CHANGELOG.tmp
                echo "" >> CHANGELOG.tmp
                echo "## ${VERSION} -- ${DATE}" >> CHANGELOG.tmp
                cat CHANGELOG_LATEST.md >> CHANGELOG.tmp
                echo "" >> CHANGELOG.tmp
                echo "---" >> CHANGELOG.tmp
                tail -n "+$((MARKER_LINE + 1))" CHANGELOG.md >> CHANGELOG.tmp
                mv CHANGELOG.tmp CHANGELOG.md
              fi
              echo "CHANGELOG.md updated for ${VERSION}."

         - name: Commit updated CHANGELOG.md
           run: |
              git add CHANGELOG.md
              git diff --staged --quiet && echo "No changes to commit." || \
                git commit -m "chore: update CHANGELOG.md for ${{ needs.version.outputs.version }} [skip ci]"
              git push origin release

         - name: Download all platform artifacts
           uses: actions/download-artifact@v4
           with:
              path: artifacts
              merge-multiple: true

         # Uses the preinstalled GitHub CLI instead of softprops/action-gh-release,
         # which can hang indefinitely after an "Error saving asset" failure.
         # Idempotent: reuses an existing release for the tag and overwrites assets.
         - name: Publish GitHub Release
           timeout-minutes: 10
           env:
              GH_TOKEN: ${{ github.token }}
              VERSION: ${{ needs.version.outputs.version }}
           shell: bash
           run: |
              ls -la artifacts
              if ! gh release view "$VERSION" >/dev/null 2>&1; then
                gh release create "$VERSION" \
                  --title "$VERSION" \
                  --notes-file CHANGELOG_LATEST.md \
                  --verify-tag
              fi
              gh release upload "$VERSION" artifacts/* --clobber
