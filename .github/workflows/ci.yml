name: CI

# Build and run all unit tests (Core LTC/timecode math, Audio's MTC protocol logic,
# App's engine state machine + OBS auth) on every push to `dev` and on pull requests
# targeting `release`. This catches broken builds and regressions before anything
# reaches the release branch.
on:
   push:
      branches:
         - dev
   pull_request:
      branches:
         - release

jobs:
   build-and-test:
      name: Build & Test (${{ matrix.os }})
      runs-on: ${{ matrix.os }}
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-latest, windows-latest]

      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Set up .NET 8 SDK
           uses: actions/setup-dotnet@v4
           with:
              dotnet-version: "8.0.x"

         - name: Restore
           run: dotnet restore

         - name: Build
           run: dotnet build --no-restore --configuration Release

         # Runs every test project in the solution: Core's LTC/timecode-handler math
         # (NDF + drop-frame, SMPTE 12M bit encoding, WAV output — verified against the
         # original Python implementation's values), Audio's MTC quarter-frame protocol
         # logic and click-tone generation, and App's engine state machine + OBS auth.
         # Audio/MIDI hardware I/O itself isn't exercised here — those tests are scoped
         # to pure logic so they don't depend on a real playback/MIDI device being present.
         - name: Test
           run: dotnet test --no-build --configuration Release
